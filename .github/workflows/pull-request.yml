# Checks every pull request to main: formatting, detekt, Android Lint with the Android API check,
# unit tests, screenshot tests, a debug build, the Room schema check, and the scan of the screenshot
# test folders. It runs the all-checks command from AGENTS.md.
name: Pull request

on:
  pull_request:
    branches: [main]
  # Runs on main fill the Gradle cache. Pull request runs only read it.
  push:
    branches: [main]
  # No path filters. Branch protection requires this check, and a check from a skipped workflow
  # stays pending and blocks merging.

permissions:
  contents: read

# A new push to a pull request cancels its older run. On main, a new run lets a running one finish
# but replaces one that is still waiting. That does no harm, because runs on main fill the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Branch protection for main requires this check by its name (#29). Renaming the job blocks
    # merging until the rule is updated.
    name: Checks
    # Pinned, so that a move of ubuntu-latest to a new Ubuntu version happens in its own pull
    # request. The image itself still gets GitHub's weekly updates.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs git credentials.
          persist-credentials: false

      # The build compiles with a JDK 17 toolchain and never downloads one. Gradle runs on this
      # JDK, so it finds the toolchain.
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Basic caching keeps Gradle's proprietary caching component from loading, so this
          # setting must stay. The default, enhanced caching, uses that component.
          # https://github.com/gradle/actions/blob/v6.4.0/DISTRIBUTION.md
          cache-provider: basic
          # Checks the wrapper JAR against the checksums Gradle publishes.
          validate-wrappers: true

      # compileSdk 37 in build-logic needs platform 37.0, and AGP's default build tools are
      # 36.0.0. When either changes, update this step, the same step in emulator-tests.yml and the
      # Commands section of AGENTS.md.
      - name: Install the Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      # --continue reports every failing check in one run. sdkDownload=false makes a missing SDK
      # package fail the build instead of downloading silently.
      - name: Check formatting, run detekt, lint, unit and screenshot tests, and build the debug APK
        run: >-
          ./gradlew --continue -Pandroid.builder.sdkDownload=false
          spotlessCheck detekt lint test testDebugScreenshotTestDefaultTestSuite assembleDebug

      # Room rewrites the schema files in core/database/schemas/ when the database changes, and the
      # build still passes, even when the version number stays the same. This fails when the build
      # changed or added a schema file that the pull request doesn't include. It runs even when the
      # step above failed, so one run reports every failing check.
      - name: Check that the Room schemas are committed
        if: ${{ !cancelled() }}
        run: |
          changes="$(git status --porcelain --untracked-files=all -- core/database/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::The build changed these Room schema files. Commit them:"
            echo "$changes"
            exit 1
          fi

      # Lint can't read the src/screenshotTest folders, so this checks that they hold only one-call
      # preview wrappers and reference images. See docs/testing.md#screenshot-tests. It runs even
      # when a step above failed.
      - name: Check the screenshot test folders
        if: ${{ !cancelled() }}
        run: python3 -I scripts/scan_screenshot_tests.py

      # The screenshot tests' report names the images it compared. The new and diff images stay in
      # the results folder, so they are uploaded too.
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/intermediates/*/testDebugScreenshotTestDefaultTestSuite/results/
          retention-days: 7
          if-no-files-found: ignore
