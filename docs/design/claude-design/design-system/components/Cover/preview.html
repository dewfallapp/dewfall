<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dewfall</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--on-surface); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .leaf { fill: var(--primary); }
  .leaf-2 { fill: var(--primary-container); }
  .slate { fill: var(--tertiary); }
  .mist { fill: var(--secondary-container); }
  .blk { rx: var(--shape-large); }
  .drop-t { fill: var(--tertiary); }
  .drop-p { fill: var(--primary); }
  .drop-cut { fill: var(--surface); }
  .words { position: absolute; left: var(--space-lg); bottom: var(--space-lg); max-width: 440px; }
  .name { margin: 0; font-size: 104px; line-height: .92; font-weight: 400; letter-spacing: -0.02em; color: var(--on-surface); }
  .tag { margin: var(--space-sm) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--on-surface-variant); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 144 x 280 slab bled off the top (the brand's key color, largest) · secondary-container 128 x 144 (the mist tint) · tertiary 96 x 192 (slate accent) · primary-container 64 x 96 bled off the right edge; all stand on one baseline space-lg above the bottom, about 29% of 960 x 288
  arrangement one tall slab with three satellites of falling height, like stems in a row, gaps space-md
  pattern     dew drops, from "dew forms overnight and is there by morning": shape-full discs sitting on the top edges of the blocks as if condensed there, plus a few cut out of the slab in surface; 15 discs
  scales      sides in space-sm multiples; gaps space-md; baseline space-lg; disc diameters space-sm, space-md, space-lg; block corners shape-large; discs shape-full (r = half the diameter)
-->
<rect class="leaf blk" x="16" y="-16" width="144" height="280" rx="16"/>
<rect class="mist blk" x="176" y="120" width="128" height="144" rx="16"/>
<rect class="slate blk" x="320" y="72" width="96" height="192" rx="16"/>
<rect class="leaf-2 blk" x="432" y="168" width="64" height="96" rx="16"/>
<circle class="drop-t" cx="204" cy="108" r="12"/>
<circle class="drop-t" cx="230" cy="116" r="4"/>
<circle class="drop-t" cx="252" cy="112" r="8"/>
<circle class="drop-t" cx="284" cy="116" r="4"/>
<circle class="drop-p" cx="344" cy="64" r="8"/>
<circle class="drop-p" cx="366" cy="68" r="4"/>
<circle class="drop-p" cx="392" cy="60" r="12"/>
<circle class="drop-t" cx="452" cy="160" r="8"/>
<circle class="drop-t" cx="472" cy="164" r="4"/>
<circle class="drop-cut" cx="52" cy="184" r="12"/>
<circle class="drop-cut" cx="88" cy="212" r="4"/>
<circle class="drop-cut" cx="116" cy="168" r="8"/>
<circle class="drop-cut" cx="64" cy="232" r="4"/>
<circle class="drop-cut" cx="124" cy="236" r="12"/>
<circle class="drop-cut" cx="92" cy="140" r="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">Dewfall</h1>
<p class="tag">Downloaded overnight. A list you can finish.</p>
</div>
</div>
</body>
</html>
