<!-- @dsCard group="Status" height=330 subtitle="Subscribed, not subscribed" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Subscription card</title></head>
<body>
<div class="df-stage">
  <div class="df-device">
    <p class="df-note body-small">Subscribed</p>
    <section class="df-subcard" aria-label="Subscription">
      <div class="df-subcard__row">
        <span class="df-icon" data-icon="check" aria-hidden="true"></span>
        <div class="df-subcard__text"><h2 class="df-subcard__title title-small">Subscribed</h2><p class="df-subcard__body body-medium">New videos download overnight while your phone charges.</p></div>
      </div>
      <div class="df-subcard__actions"><button class="df-btn df-btn--text df-state label-large">Unsubscribe</button></div>
    </section>
  </div>
  <div class="df-device">
    <p class="df-note body-small">Not subscribed</p>
    <section class="df-subcard" aria-label="Subscription">
      <div class="df-subcard__row">
        <span class="df-icon" data-icon="add" aria-hidden="true"></span>
        <div class="df-subcard__text"><h2 class="df-subcard__title title-small">Not subscribed</h2><p class="df-subcard__body body-medium">Subscribe and this channel's new videos download overnight with the rest.</p></div>
      </div>
      <div class="df-subcard__actions"><button class="df-btn df-btn--filled df-btn--icon df-state label-large"><span class="df-icon df-icon--18" data-icon="add" aria-hidden="true"></span>Subscribe</button></div>
    </section>
  </div>
</div>
</body></html>
