<!-- @dsCard group="Actions" height=100 subtitle="Standard, filled, tonal toggle, outlined, disabled" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Icon buttons</title></head>
<body>
<div class="df-stage df-stage--row">
  <button class="df-iconbtn" aria-label="Check for new videos"><span class="df-iconbtn__face"><span class="df-icon" data-icon="sync" aria-hidden="true"></span></span></button>
  <button class="df-iconbtn" aria-label="More options"><span class="df-iconbtn__face"><span class="df-icon" data-icon="more_vert" aria-hidden="true"></span></span></button>
  <button class="df-iconbtn df-iconbtn--filled" aria-label="Play"><span class="df-iconbtn__face"><span class="df-icon" data-icon="play_arrow" data-fill aria-hidden="true"></span></span></button>
  <button class="df-iconbtn df-iconbtn--tonal" aria-label="Keep" aria-pressed="true"><span class="df-iconbtn__face"><span class="df-icon" data-icon="keep" aria-hidden="true"></span></span></button>
  <button class="df-iconbtn df-iconbtn--outlined" aria-label="Download now"><span class="df-iconbtn__face"><span class="df-icon" data-icon="download" aria-hidden="true"></span></span></button>
  <button class="df-iconbtn df-iconbtn--outlined" aria-label="Download now" disabled><span class="df-iconbtn__face"><span class="df-icon" data-icon="download" aria-hidden="true"></span></span></button>
</div>
</body></html>
