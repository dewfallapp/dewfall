<!-- @dsCard group="Actions" height=290 subtitle="Filter, toggle, assist and status" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Chips</title></head>
<body>
<div class="df-stage df-device">
  <p class="df-note body-small">Filter, on Search subtitles results</p>
  <div class="df-chips" role="group" aria-label="Filter by channel">
    <button class="df-chip df-chip--icon df-state label-large" aria-pressed="true"><span class="df-icon df-icon--18" data-icon="check" aria-hidden="true"></span>All watched (24)</button>
    <button class="df-chip df-state label-large" aria-pressed="false">Larkspur Lectures (6)</button>
    <button class="df-chip df-state label-large" aria-pressed="false">Tidewater Woodshop (4)</button>
  </div>
  <p class="df-note body-small">Toggle, on the player</p>
  <div class="df-chips">
    <button class="df-chip df-chip--icon df-state label-large" aria-pressed="false"><span class="df-icon df-icon--18" data-icon="keep" aria-hidden="true"></span>Keep</button>
    <button class="df-chip df-chip--icon df-state label-large" aria-pressed="true"><span class="df-icon df-icon--18" data-icon="check" aria-hidden="true"></span>Watched</button>
  </div>
  <p class="df-note body-small">Assist and status</p>
  <div class="df-chips">
    <button class="df-chip df-chip--icon df-chip--assist df-state label-large"><span class="df-icon df-icon--18" data-icon="download" aria-hidden="true"></span>Download now</button>
    <span class="df-status label-large"><span class="df-icon df-icon--18" data-icon="schedule" aria-hidden="true"></span>Next downloads tonight, on Wi-Fi while charging</span>
  </div>
</div>
</body></html>
