<!-- @dsCard group="Search" height=380 subtitle="Search YouTube and Search subtitles, empty and with a query" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Search field</title></head>
<body>
<div class="df-stage">
  <div class="df-device">
    <p class="df-note body-small">Search YouTube, before typing</p>
    <div class="df-search"><span class="df-icon" data-icon="search" aria-hidden="true"></span><input class="df-search__input body-large" type="search" placeholder="Search YouTube" aria-label="Search YouTube"></div>
  </div>
  <div class="df-device">
    <p class="df-note body-small">Search YouTube, with a query</p>
    <div class="df-search df-search--filled"><span class="df-icon" data-icon="search" aria-hidden="true"></span><input class="df-search__input body-large" type="search" value="sourdough" aria-label="Search YouTube"><button class="df-iconbtn" aria-label="Clear search"><span class="df-iconbtn__face"><span class="df-icon" data-icon="close" aria-hidden="true"></span></span></button></div>
  </div>
  <div class="df-device">
    <p class="df-note body-small">Search subtitles, before typing</p>
    <div class="df-search"><span class="df-icon" data-icon="subtitles" aria-hidden="true"></span><input class="df-search__input body-large" type="search" placeholder="Search saved subtitles" aria-label="Search saved subtitles"></div>
  </div>
  <div class="df-device">
    <p class="df-note body-small">Search subtitles, with a query</p>
    <div class="df-search df-search--filled"><span class="df-icon" data-icon="subtitles" aria-hidden="true"></span><input class="df-search__input body-large" type="search" value="light" aria-label="Search saved subtitles"><button class="df-iconbtn" aria-label="Clear search"><span class="df-iconbtn__face"><span class="df-icon" data-icon="close" aria-hidden="true"></span></span></button></div>
  </div>
</div>
</body></html>
