<!-- @dsCard group="Actions" height=170 subtitle="Filled, tonal, outlined, text, disabled" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title></head>
<body>
<div class="df-stage">
  <div class="df-chips">
    <button class="df-btn df-btn--filled df-btn--icon df-state label-large"><span class="df-icon df-icon--18" data-icon="download" aria-hidden="true"></span>Download now</button>
    <button class="df-btn df-btn--tonal df-state label-large">Manage downloads</button>
    <button class="df-btn df-btn--outlined df-btn--icon df-state label-large"><span class="df-icon df-icon--18" data-icon="play_arrow" aria-hidden="true"></span>Stream</button>
    <button class="df-btn df-btn--text df-state label-large">Raise limit</button>
  </div>
  <div class="df-chips">
    <button class="df-btn df-btn--filled df-btn--icon label-large" disabled><span class="df-icon df-icon--18" data-icon="download" aria-hidden="true"></span>Download now</button>
    <button class="df-btn df-btn--outlined label-large" disabled>Stream</button>
  </div>
</div>
</body></html>
