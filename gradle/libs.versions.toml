[versions]
agp = "9.4.1"
kotlin = "2.4.20"
desugarJdkLibsNio = "2.1.5"
spotless = "8.10.3"
# The formatter that Spotless runs. Spotless downloads it, so it has no library entry.
ktfmt = "0.64"
detekt = "2.0.0-alpha.6"
# compose-rules adds Compose rules to detekt. Each release is built for one detekt version, so a
# detekt update waits for a compose-rules release built for the new version. Matching versions:
# https://github.com/mrmans0n/compose-rules/blob/v0.6.7/docs/detekt.md#supported-versions-matrix
composeRules = "0.6.7"
animalsniffer = "2.0.1"
# Android API signatures for Animal Sniffer. build-logic adds the artifact, whose name holds
# the API level, so it has no library entry.
gummyBears = "0.15.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
startup = "1.2.0"
hilt = "2.60.1"
ksp = "2.3.12"
# Room 3, in the androidx.room3 package, for the runtime, the compiler and the Gradle plugin.
# Room 2 is deprecated. See docs/architecture.md#build-settings.
room3 = "3.0.3"
lifecycle = "2.11.0"
kotlinxCoroutines = "1.11.0"
# JUnit 6 runs the unit tests of the plain Kotlin/JVM modules. See docs/testing.md.
junit = "6.1.3"
# JUnit 4 runs the local unit tests of the Android modules, because Robolectric and Compose's
# test rules need it. See docs/testing.md.
junit4 = "4.13.2"
kotlinxSerialization = "1.11.0"

[libraries]
desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugarJdkLibsNio" }

# The Compose BOM sets the versions of the Compose libraries below it.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startup" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }

# :core:mvi's ViewModel base. A plain Kotlin/JVM module gets Lifecycle's JVM build, and an Android
# module gets its Android build. See docs/architecture.md#the-mvi-contract.
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# Unit test libraries. The convention plugins in build-logic add them to every module's tests.
# Tests use kotlin.test's annotations and assertions, which run on JUnit 6 in plain Kotlin/JVM
# modules and on JUnit 4 in Android modules. kotlin-test's JUnit 5 adapter also runs on JUnit 6.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# The JUnit BOM sets the versions of the JUnit 6 artifacts below it, and of those that
# kotlin-test-junit5 brings in.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
# Only :core:designsystem's tests use it, to check the theme against the design tokens. See
# docs/architecture.md#the-theme.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# A detekt plugin. The detekt convention plugin in build-logic adds it to detekt in every project.
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRules" }

# Used only by build-logic, to compile the convention plugins.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room3-gradlePlugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "room3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# The Compose compiler ships with Kotlin, so it always has the Kotlin version.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room3 = { id = "androidx.room3", version.ref = "room3" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
