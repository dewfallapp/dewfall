org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The build compiles with a JDK 17 toolchain, which must be installed.
# Gradle never downloads one.
org.gradle.java.installations.auto-download=false

kotlin.code.style=official

# Screenshot tests run in AGP's screenshot test suites, which need both experimental flags. Each
# build prints a warning that they are experimental. See docs/testing.md#screenshot-tests and
# https://developer.android.com/studio/preview/compose-screenshot-testing-with-testsuites
android.experimental.enableScreenshotTest=true
android.experimental.testSuiteSupport=true
